name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK (installable)
        uses: actions/upload-artifact@v4
        with:
          name: MyAppBlocker-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAppBlocker-release-unsigned
          path: app/build/outputs/apk/release/*.apk

      - name: Attach APK to GitHub Release (only when pushing a tag like v1.0)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
